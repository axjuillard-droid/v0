version: '3.8'

services:
  catalogue-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalogue_nas_app
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@catalogue-db:5432/catalogue_metadata}
      - PORT=5000
      - HOST=0.0.0.0
      - NO_BROWSER=true
      - WORKERS=0
      - DB_POOL_MIN=4
      - DB_POOL_MAX=20
    depends_on:
      catalogue-db:
        condition: service_healthy
    restart: always

  catalogue-db:
    image: postgres:15-alpine
    container_name: catalogue_nas_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalogue_metadata
    ports:
      - "5432:5432"
    volumes:
      - postgres_metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalogue_metadata"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_metadata_data:
